# The Hunter — runtime dependencies for the installed app.
#
# The app is a data pipeline plus a local web dashboard on top of the public
# Indodax REST API. Apart from these packages it is pure Python. Every pin below
# ships manylinux wheels for x86_64 AND aarch64 on Python 3.11 and 3.12, which is
# why they are exact: an unpinned install resolves to whatever is newest that day
# and can land on a version with no wheel for the target, which then has to build
# from source or fail.
#
# WHAT IS NOT HERE, AND WHY
#
# The ML veto layer was removed from the product on 2026-11-08. That removed the
# entire scientific stack — scikit-learn, numpy, scipy, joblib, threadpoolctl and
# cloudpickle — which was ~120 MB of compiled wheels and the single largest part
# of the install. A fresh install no longer needs those, imports ~127 MB less,
# and runs unchanged on a 1 GB ARM board.
#
# The lock is the exact transitive closure of the four direct deps, resolved in a
# clean Python 3.11 venv. Do NOT add a package without confirming both
# interpreters have a wheel for it — the installed machine has no compiler.
#
# Install with:  pip install -r requirements.lock
# Never install bare package names on an installed machine.

